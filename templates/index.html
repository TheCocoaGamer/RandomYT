<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>YouTube Randomizer TV</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
    }

    iframe,
    #player {
      border: none;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>
  <div id="player"></div>
  <script>
    let player;
    let isLoading = false;  // Prevent double loading
    let hasEnded = false;   // Prevent duplicate END handling
    let currentVideoId = null; // Track which video is expected

    let tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    let firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: '',
        playerVars: {
          'autoplay': 1,
          'mute': 1,
          'cc_load_policy': 1,
          'modestbranding': 1,
          'rel': 0,
          'controls': 1
        },
        events: {
          'onReady': fetchAndPlayVideo,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function fetchAndPlayVideo() {
      if (isLoading) {
        console.log("⏳ Already loading a video. Skipping duplicate fetch.");
        return;
      }
      isLoading = true;

      fetch('/api/random-video')
        .then(response => response.json())
        .then(data => {
          if (data.videoId) {
            console.log("🎯 New Video ID:", data.videoId);
            console.log("Method:", data.method, "| Query:", data.query, "| Filter:", data.filter, "| Source:", data.fallback);
            player.loadVideoById(data.videoId);
            currentVideoId = data.videoId;  // Lock in expected video
          } else {
            console.warn("⚠️ No video ID found for query:", data.query, "| Method:", data.method);
            isLoading = false;
            setTimeout(fetchAndPlayVideo, 2000); // Retry
          }
        })
        .catch(err => {
          console.error("❌ Error fetching video:", err);
          isLoading = false;
          setTimeout(fetchAndPlayVideo, 3000);
        });
    }

    function onPlayerStateChange(event) {
      console.log("Player state changed:", event.data);

      if (event.data === YT.PlayerState.ENDED) { // 0 = ended
        let videoData = player.getVideoData();
        let reportedVideoId = videoData && videoData.video_id;

        if (reportedVideoId !== currentVideoId) {
          console.log(`⚠️ END event ignored. Reported ID "${reportedVideoId}" does not match expected "${currentVideoId}".`);
          return;
        }

        if (!hasEnded) {
          hasEnded = true;
          console.log("🔄 Video ended. Loading next...");
          isLoading = false;
          fetchAndPlayVideo();
        } else {
          console.log("⏳ Ignored duplicate END event for video:", reportedVideoId);
        }
      }

      if (event.data === YT.PlayerState.PLAYING) { // 1 = playing
        isLoading = false;
        hasEnded = false;  // Reset for new video
      }
    }

  </script>
</body>

</html>
