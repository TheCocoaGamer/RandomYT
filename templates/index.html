<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>YouTube Randomizer TV</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: black;
      }
      iframe {
        border: none;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <iframe 
      id="player" 
      allow="autoplay" 
      allowfullscreen 
      src="">
    </iframe>

    <script>
      function fetchAndPlayVideo() {
        fetch('/api/random-video')
          .then(response => response.json())
          .then(data => {
            if (data.videoId) {
              console.log("🎯 New Video ID:", data.videoId);
              console.log("Method:", data.method, "| Query:", data.query, "| Filter:", data.filter, "| Source:", data.fallback);
              loadVideo(data.videoId);
            } else {
              console.warn("⚠️ No video ID found for query:", data.query, "| Method:", data.method);
              setTimeout(fetchAndPlayVideo, 2000); // Retry in 2 seconds
            }
          })
          .catch(err => {
            console.error("❌ Error fetching video:", err);
            setTimeout(fetchAndPlayVideo, 3000);
          });
      }

      function loadVideo(videoId) {
        const iframe = document.getElementById("player");
        iframe.src = `https://www.youtube.com/embed/${videoId}?enablejsapi=1&autoplay=1&mute=1&cc_load_policy=1&modestbranding=1&rel=0&controls=1`;
      }

      // Listen for video end → fetch new video
      window.addEventListener("message", (event) => {
        if (typeof event.data !== "string") return;
        try {
          const message = JSON.parse(event.data);
          if (message.event === "onStateChange") {
            console.log("Player state changed:", message.info);
            if (message.info === 0) { // 0 = ended
              console.log("🔄 Video ended. Loading next...");
              fetchAndPlayVideo();
            }
          }
        } catch (e) {
          console.error("❌ Failed to parse player message:", e);
        }
      });

      // Start the first video
      fetchAndPlayVideo();
    </script>
  </body>
</html>
