<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>YouTube Randomizer TV</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: black;
      }
      iframe, #player {
        border: none;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="player"></div>

    <script>
      let player;

      // 1️⃣ Load the YouTube Iframe API dynamically
      let tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      let firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

      // 2️⃣ When API is ready, create the player
      function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
          height: '100%',
          width: '100%',
          videoId: '', // Empty for now
          playerVars: {
            'autoplay': 1,
            'mute': 1,
            'cc_load_policy': 1,
            'modestbranding': 1,
            'rel': 0,
            'controls': 1
          },
          events: {
            'onReady': fetchAndPlayVideo,
            'onStateChange': onPlayerStateChange
          }
        });
      }

      function fetchAndPlayVideo() {
        fetch('/api/random-video')
          .then(response => response.json())
          .then(data => {
            if (data.videoId) {
              console.log("🎯 New Video ID:", data.videoId);
              console.log("Method:", data.method, "| Query:", data.query, "| Filter:", data.filter, "| Source:", data.fallback);
              player.loadVideoById(data.videoId);
            } else {
              console.warn("⚠️ No video ID found for query:", data.query, "| Method:", data.method);
              setTimeout(fetchAndPlayVideo, 2000); // Retry in 2 seconds
            }
          })
          .catch(err => {
            console.error("❌ Error fetching video:", err);
            setTimeout(fetchAndPlayVideo, 3000);
          });
      }

      function onPlayerStateChange(event) {
        console.log("Player state changed:", event.data);
        if (event.data === YT.PlayerState.ENDED) { // Video ended
          console.log("🔄 Video ended. Loading next...");
          fetchAndPlayVideo();
        }
      }
    </script>
  </body>
</html>
