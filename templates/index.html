<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>YouTube Randomizer TV</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
    }

    iframe,
    #player {
      border: none;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>
  <div id="player"></div>
  <script>
    let player;
    let currentVideoId = null;
    let isFetchingVideo = false;
    let playbackTimeout = null;

    let tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    let firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: '',
        playerVars: {
          'autoplay': 1,
          'mute': 1,
          'cc_load_policy': 1,
          'modestbranding': 1,
          'rel': 0,
          'controls': 1
        },
        events: {
          'onReady': fetchAndPlayVideo,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function fetchAndPlayVideo() {
      if (isFetchingVideo) {
        console.log("⏳ Already waiting for current video to finish. Ignoring fetch call.");
        return;
      }

      isFetchingVideo = true;  // Lock here and *do not* unlock until next END

      fetch('/api/random-video')
        .then(response => response.json())
        .then(data => {
          if (data.videoId) {
            console.log("🎯 New Video ID:", data.videoId);
            console.log("Method:", data.method, "| Query:", data.query, "| Filter:", data.filter, "| Source:", data.fallback);

            currentVideoId = data.videoId;
            player.loadVideoById(data.videoId);

            // Optional: If video never starts, try again after timeout
            if (playbackTimeout) clearTimeout(playbackTimeout);
            playbackTimeout = setTimeout(() => {
              console.warn("⚠️ Video failed to start or blocked. Forcing next video.");
              isFetchingVideo = false;
              fetchAndPlayVideo();
            }, 10000); // 10 seconds fallback

          } else {
            console.warn("⚠️ No video ID found for query.");
            isFetchingVideo = false;
            setTimeout(fetchAndPlayVideo, 2000);
          }
        })
        .catch(err => {
          console.error("❌ Error fetching video:", err);
          isFetchingVideo = false;
          setTimeout(fetchAndPlayVideo, 3000);
        });
    }

    function onPlayerStateChange(event) {
      console.log("Player state changed:", event.data);

      const videoData = player.getVideoData();
      const reportedVideoId = videoData ? videoData.video_id : null;

      if (event.data === YT.PlayerState.PLAYING) {
        if (playbackTimeout) clearTimeout(playbackTimeout);
        console.log("▶️ Video is now playing:", reportedVideoId);
        // Notice: We do NOT unlock here anymore.
      }

      if (event.data === YT.PlayerState.ENDED) {
        if (reportedVideoId !== currentVideoId) {
          console.log(`⚠️ END event ignored. Reported ID "${reportedVideoId}" does not match expected "${currentVideoId}".`);
          return;
        }
        console.log("🔄 Video ended. Ready to load next.");
        isFetchingVideo = false;  // Unlock only here
        fetchAndPlayVideo();
      }
    }
  </script>
</body>

</html>
