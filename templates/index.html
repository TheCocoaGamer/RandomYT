<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>YouTube Randomizer TV</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: black;
      }
      iframe {
        border: none;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <iframe 
      id="player" 
      allow="autoplay" 
      allowfullscreen 
      src="">
    </iframe>

    <script>
      function fetchAndPlayVideo() {
        fetch('/api/random-video')
          .then(response => response.json())
          .then(data => {
            if (data.videoId) {
              console.log("▶️ Video ID:", data.videoId);
              loadVideo(data.videoId);
            } else {
              console.error("No video ID returned. Retrying...");
              setTimeout(fetchAndPlayVideo, 2000);
            }
          })
          .catch(err => {
            console.error("Error fetching video:", err);
            setTimeout(fetchAndPlayVideo, 2000);
          });
      }

      function loadVideo(videoId) {
        const iframe = document.getElementById("player");
        iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=0&cc_load_policy=1&enablejsapi=1&modestbranding=1&rel=0&controls=0`;
      }

      // Listen for video end (YouTube iframe API workaround)
      window.addEventListener("message", (event) => {
        if (typeof event.data !== "string") return;
        try {
          const message = JSON.parse(event.data);
          if (message.event === "onStateChange" && message.info === 0) {
            console.log("⏭ Video ended, fetching new one...");
            fetchAndPlayVideo();
          }
        } catch (e) {}
      });

      fetchAndPlayVideo();
    </script>
  </body>
</html>
