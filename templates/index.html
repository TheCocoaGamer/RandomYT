<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>YouTube Randomizer TV</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
    }
    iframe, #player {
      border: none;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>
  <div id="player"></div>
  <script>
    let player;
    let isFetching = false;
    let nextVideoPending = false;
    let currentVideoId = null;
    const safetyDelayMs = 2000;

    // Timestamped logger
    function log(msg) {
      const now = new Date();
      const timestamp = now.toLocaleTimeString();
      console.log(`[${timestamp}] ${msg}`);
    }

    let tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    let firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: '',
        playerVars: {
          'autoplay': 1,
          'mute': 0,
          'cc_load_policy': 1,
          'modestbranding': 1,
          'rel': 0,
          'controls': 1
        },
        events: {
          'onReady': () => {
            log("Player ready.");
            fetchAndPlayVideo();
          },
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function fetchAndPlayVideo() {
      if (isFetching) {
        log(`⏳ Fetch in progress. Queuing next video. (Current ID: ${currentVideoId || 'none'})`);
        nextVideoPending = true;
        return;
      }
      isFetching = true;

      fetch('/api/random-video')
        .then(response => response.json())
        .then(data => {
          if (data.videoId) {
            log(`🎯 New Video ID: ${data.videoId}`);
            log(`Method: ${data.method} | Query: ${data.query} | Filter: ${data.filter || "n/a"} | Source: ${data.fallback || "scraper"} | Assigned ID: ${data.videoId}`);
            currentVideoId = data.videoId;
            player.loadVideoById(data.videoId);
          } else {
            log(`⚠️ No video found for query: ${data.query} | ID: ${currentVideoId || 'none'}`);
            isFetching = false;
            setTimeout(fetchAndPlayVideo, 2000);
          }
        })
        .catch(err => {
          log(`❌ Error fetching video: ${err} | ID: ${currentVideoId || 'none'}`);
          isFetching = false;
          setTimeout(fetchAndPlayVideo, 3000);
        });
    }

    function onPlayerStateChange(event) {
      log(`Player state changed: ${event.data} | Video ID: ${currentVideoId || 'none'}`);

      if (event.data === YT.PlayerState.ENDED) {
        log(`🔄 Video ended. ID: ${currentVideoId || 'none'}. Ready to load next.`);
        if (!isFetching) {
          fetchAndPlayVideo();
        } else {
          log(`⚠️ Video ended but fetch already in progress for ID: ${currentVideoId}`);
          nextVideoPending = true;
        }
      }

      if (event.data === YT.PlayerState.PLAYING) {
        log(`▶️ Video is now playing: ${currentVideoId || 'none'}`);
        setTimeout(() => {
          if (nextVideoPending) {
            log(`⏳ Queued video request detected. Loading next... (Current ID: ${currentVideoId})`);
            nextVideoPending = false;
            fetchAndPlayVideo();
          } else {
            log(`✅ Playback started cleanly for ID: ${currentVideoId}`);
          }
          isFetching = false;
        }, safetyDelayMs);
      }
    }
  </script>
</body>

</html>
